<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spring School System</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/nnk47ifn/image/upload/v1788755036/spring_school.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#152863; --ink-2:#1F3A82; --ink-3:#2C4A9A;
    --parchment:#FAF9F5; --paper:#FFFFFF;
    --gold:#C9A227; --gold-light:#F3E9C8; --gold-dark:#9C7C1B;
    --line:#E7E2D4; --line-strong:#D8D0BB;
    --text:#26251F; --text-muted:#726F62; --text-faint:#A7A392;
    --green:#3F6851; --green-bg:#E4EDE7;
    --red:#A94A3A; --red-bg:#F3E4E1;
    --amber:#B8863A; --amber-bg:#F3E9D4;
    --shadow-sm: 0 1px 2px rgba(21,40,99,0.04), 0 1px 1px rgba(21,40,99,0.03);
    --shadow-md: 0 4px 16px rgba(21,40,99,0.07), 0 1px 3px rgba(21,40,99,0.05);
    --shadow-lg: 0 12px 40px rgba(21,40,99,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--parchment); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.5; }
  h1,h2,h3,.serif{ font-family:'Libre Caslon Text', serif; font-weight:400; }
  a{color:inherit;}
  button{ font-family:'Inter',sans-serif; cursor:pointer; transition:background-color .15s ease, border-color .15s ease, opacity .15s ease; }
  input,select,textarea{ font-family:'Inter',sans-serif; transition:border-color .15s ease; }

  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(circle at 20% 15%, rgba(201,162,39,0.10), transparent 45%), linear-gradient(160deg, var(--ink) 0%, #0F1C48 100%); }
  .login-card{ width:100%; max-width:408px; background:var(--paper); border-radius:14px; padding:44px 40px 36px; box-shadow:var(--shadow-lg); }
  .login-crest{ width:78px; height:78px; border-radius:50%; margin:0 auto 20px; overflow:hidden; background:#fff; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
  .login-crest img{ width:100%; height:100%; object-fit:contain; }
  .login-title{ text-align:center; font-size:25px; margin:0 0 5px; color:var(--ink); letter-spacing:.2px; }
  .login-sub{ text-align:center; color:var(--text-muted); font-size:13.5px; margin:0 0 28px; }
  .field-label{ font-size:12px; font-weight:500; color:var(--text-muted); display:block; margin:16px 0 6px; letter-spacing:.15px; }
  .text-input, select.text-input{ width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:7px; font-size:14px; background:#fdfcf9; color:var(--text); }
  .text-input:focus, select.text-input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.14); }
  textarea.text-input{ resize:vertical; }
  .btn-primary{ width:100%; margin-top:24px; padding:12px; background:var(--ink); color:#fff; border:none; border-radius:7px; font-size:14px; font-weight:500; letter-spacing:.2px; }
  .btn-primary:hover{ background:var(--ink-2); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }
  .error-text{ color:var(--red); font-size:12.5px; margin-top:10px; line-height:1.5; }
  .notice-text{ color:var(--green); font-size:12.5px; margin-top:10px; }
  .switch-line{ text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted); }
  .switch-link{ color:var(--gold-dark); font-weight:500; background:none; border:none; text-decoration:underline; font-size:13px; padding:0; }

  #app{ display:none; }
  #app.visible{ display:flex; min-height:100vh; }
  .sidebar{ width:236px; flex-shrink:0; background:var(--ink); color:#EDE7D6; display:flex; flex-direction:column; padding:24px 0; position:sticky; top:0; height:100vh; }
  .brand{ padding:0 22px 20px; border-bottom:1px solid rgba(255,255,255,0.10); margin-bottom:16px; display:flex; align-items:center; gap:11px; }
  .brand-logo{ width:36px; height:36px; border-radius:50%; background:#fff; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .brand-logo img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{ min-width:0; }
  .brand-name{ font-family:'Libre Caslon Text',serif; font-size:17.5px; color:#fff; line-height:1.25; }
  .brand-tag{ font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:1.2px; margin-top:3px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:10px 22px; margin:1px 10px; border-radius:7px; font-size:13.5px; color:#B9B4A2; border-left:none; background:none; border:none; width:calc(100% - 20px); text-align:left; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(201,162,39,0.16); color:#fff; font-weight:500; }
  .nav-spacer{ flex:1; }
  .sidebar-foot{ padding:16px 22px 0; border-top:1px solid rgba(255,255,255,0.10); margin-top:12px; }
  .who{ font-size:13.5px; color:#fff; font-weight:500; }
  .who-role{ font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.8px; margin-top:3px; }
  .logout-link{ display:inline-block; margin-top:11px; font-size:12px; color:#9C9788; background:none; border:none; padding:0; }
  .logout-link:hover{ color:#fff; text-decoration:underline; }

  .main{ flex:1; min-width:0; position:relative; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:1px solid var(--line); background:var(--paper); }
  .topbar-title{ font-size:23px; color:var(--ink); letter-spacing:.2px; }
  .topbar-date{ font-size:12.5px; color:var(--text-faint); }
  .content{ padding:34px 40px 70px; max-width:1060px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .section-head h2{ font-size:20px; color:var(--ink); margin:0; }
  .count{ font-size:12.5px; color:var(--text-faint); }

  .btn{ padding:8px 15px; border-radius:7px; border:1px solid var(--line-strong); background:var(--paper); font-size:13px; color:var(--text); font-weight:500; }
  .btn:hover{ border-color:var(--ink-3); color:var(--ink); }
  .btn-gold{ background:var(--gold); border-color:var(--gold-dark); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-gold:hover{ background:var(--gold-dark); }
  .btn-danger{ color:var(--red); }
  .btn-danger:hover{ border-color:var(--red); }
  .btn-sm{ padding:5px 11px; font-size:12px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); font-weight:600; padding:0 12px 12px; border-bottom:1px solid var(--line-strong); }
  td{ padding:13px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(21,40,99,0.015); }

  .pill{ display:inline-block; padding:3px 11px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:.2px; }
  .pill-amber{ background:var(--amber-bg); color:var(--amber); }

  .grid-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:34px; }
  .stat{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow-sm); }
  .stat-label{ font-size:11.5px; color:var(--text-faint); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  .stat-value{ font-family:'Libre Caslon Text',serif; font-size:27px; color:var(--ink); }
  .stat-sub{ font-size:11px; color:var(--text-faint); margin-top:5px; }

  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:24px 26px; margin-bottom:24px; box-shadow:var(--shadow-sm); }
  .panel h3{ font-size:15.5px; color:var(--ink); margin:0 0 16px; }

  .form-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .form-row > div{ flex:1; min-width:150px; }

  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(15,20,35,0.5); align-items:flex-start; justify-content:center; padding-top:64px; z-index:50; backdrop-filter:blur(2px); }
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--paper); width:100%; max-width:460px; border-radius:12px; padding:28px 28px 24px; max-height:82vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
  .modal h3{ margin:0 0 20px; font-size:17.5px; color:var(--ink); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }

  .empty{ text-align:center; padding:56px 20px; color:var(--text-muted); }
  .empty .serif{ font-size:17px; color:var(--ink); margin-bottom:6px; display:block; }

  .toggle-btn{ padding:5px 13px; border-radius:20px; border:1px solid var(--line-strong); background:#fff; font-size:12px; margin-left:6px; }
  .toggle-btn.on-present{ background:var(--green-bg); color:var(--green); border-color:var(--green); }
  .toggle-btn.on-absent{ background:var(--red-bg); color:var(--red); border-color:var(--red); }

  .announce-item{ padding:18px 0; border-bottom:1px solid var(--line); }
  .announce-item:last-child{ border-bottom:none; }
  .announce-title{ font-size:15px; color:var(--ink); font-weight:500; }
  .announce-meta{ font-size:11px; color:var(--text-faint); margin:3px 0 9px; }
  .announce-body{ font-size:13.5px; color:var(--text); line-height:1.65; }

  .center-loading{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:14px; }

  .lesson-card{ margin-bottom:22px; }
  .lesson-card h3{ margin-bottom:12px; }
  .video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:8px; overflow:hidden; background:#000; }
  .video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }

  .qbuilder-row{ border:1px solid var(--line); border-radius:9px; padding:16px; margin-bottom:12px; background:#fdfcf9; }
  .qbuilder-row .form-row > div{ min-width:120px; }
  .quiz-take-q{ border-bottom:1px solid var(--line); padding:16px 0; }
  .quiz-take-q:last-child{ border-bottom:none; }
  .quiz-opt{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; }
  .quiz-opt.correct{ color:var(--green); font-weight:500; }
  .quiz-opt.wrong-pick{ color:var(--red); font-weight:500; }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px; }
  .table-scroll table{ min-width:100%; }

  .hamburger-btn{ display:none; background:none; border:none; font-size:20px; color:var(--ink); padding:4px 6px; line-height:1; flex-shrink:0; }
  .sidebar-close-btn{ display:none; background:none; border:none; color:#fff; font-size:16px; padding:4px; margin-left:auto; flex-shrink:0; }
  .sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(10,15,30,0.5); z-index:90; }
  .sidebar-overlay.open{ display:block; }

  @media (max-width:800px){
    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:270px; max-width:82vw;
      transform:translateX(-100%); transition:transform .22s ease; z-index:95;
      box-shadow:var(--shadow-lg);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    .sidebar-close-btn{ display:block; }
    .hamburger-btn{ display:block; }
    .content{ padding:20px 18px 60px; }
    .topbar{ padding:16px 18px; }
    .topbar-title{ font-size:19px; }
    .topbar-date{ display:none; }
    .grid-stats{ grid-template-columns:repeat(2,1fr); gap:12px; }
    .stat{ padding:14px 15px; }
    .stat-value{ font-size:22px; }
    .panel{ padding:18px 18px; }
    .login-card{ padding:32px 24px 28px; max-width:400px; }
    .modal{ max-width:94vw; padding:22px 20px 18px; }
    .modal-bg{ padding-top:24px; padding-left:12px; padding-right:12px; align-items:flex-start; }
    table{ min-width:560px; }
    .section-head{ flex-wrap:wrap; gap:10px; }
  }
  @media (max-width:420px){
    .grid-stats{ grid-template-columns:1fr; }
    .login-card{ padding:28px 18px 24px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-crest" id="login-crest"><img src="https://res.cloudinary.com/nnk47ifn/image/upload/v1788755036/spring_school.jpg" alt="School logo"></div>
    <h1 class="login-title" id="login-school-name">Campus Register</h1>
    <p class="login-sub" id="login-sub-text">Sign in to your school workspace</p>

    <form id="signin-form">
      <label class="field-label">Email (staff) or Roll No (students)</label>
      <input class="text-input" type="text" id="si-email" required placeholder="name@school.edu or your roll number">
      <label class="field-label">Password</label>
      <input class="text-input" type="password" id="si-password" required placeholder="••••••••">
      <div id="si-error" class="error-text" style="display:none;"></div>
      <button class="btn-primary" type="submit" id="si-btn">Sign in</button>
    </form>

    <form id="signup-form" style="display:none;">
      <label class="field-label">Full name</label>
      <input class="text-input" id="su-name" required placeholder="e.g. Ayesha Khan">
      <label class="field-label">Role</label>
      <select class="text-input" id="su-role">
        <option value="teacher">Teacher</option>
      </select>
      <div id="su-class-wrap" style="display:none;">
        <label class="field-label">Class</label>
        <select class="text-input" id="su-class"></select>
      </div>
      <label class="field-label">Email</label>
      <input class="text-input" type="email" id="su-email" required placeholder="name@school.edu">
      <label class="field-label">Password</label>
      <input class="text-input" type="password" id="su-password" required minlength="6" placeholder="At least 6 characters">
      <div id="su-code-wrap">
        <label class="field-label">School access code</label>
        <input class="text-input" id="su-code" placeholder="Ask your school admin for this">
      </div>
      <div id="su-error" class="error-text" style="display:none;"></div>
      <button class="btn-primary" type="submit" id="su-btn">Create account</button>
    </form>

    <div id="su-notice" class="notice-text" style="display:none;"></div>

    <p class="switch-line">
      <span id="switch-prompt">New school workspace? </span>
      <button class="switch-link" id="switch-btn">Create one</button>
    </p>
  </div>
</div>

<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="https://res.cloudinary.com/nnk47ifn/image/upload/v1788755036/spring_school.jpg" alt="Logo"></div>
      <div class="brand-text">
        <div class="brand-name" id="side-school-name">Campus Register</div>
        <div class="brand-tag">School Workspace</div>
      </div>
      <button class="sidebar-close-btn" id="sidebar-close-btn" onclick="closeMobileSidebar()">✕</button>
    </div>
    <nav id="nav-items"></nav>
    <div class="nav-spacer"></div>
    <div class="sidebar-foot">
      <div class="who" id="who-name">—</div>
      <div class="who-role" id="who-role">—</div>
      <button class="logout-link" id="change-pass-btn" onclick="showChangePasswordForm()">Change password</button><br>
      <button class="logout-link" id="logout-btn">Sign out</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px; min-width:0;">
        <button class="hamburger-btn" id="hamburger-btn" onclick="openMobileSidebar()" aria-label="Open menu">☰</button>
        <div class="topbar-title serif" id="page-title">Dashboard</div>
      </div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="modal-bg" id="modal-bg">
      <div class="modal" id="modal-inner"></div>
    </div>
  </div>
</div>

<script>
/* ======================= CONFIGURE THIS ======================= */
const SUPABASE_URL = "https://hfscbxyykuielpzrhmnr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pyXjHTJIpBa88iMNl-Zq5w_igyOSaXb";
/* ================================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let PROFILE = null;
let SESSION = null;
let ACTIVE_PAGE = "dashboard";
let SCHOOL = { name: "The Spring School System", tagline: "The Future Begins Here" };

function esc(s){ const d = document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

/* ---------------- Branding ---------------- */
async function loadSchoolSettings(){
  const { data } = await sb.from("school_settings").select("*").eq("id",1).maybeSingle();
  if(data){ SCHOOL = { name: data.name || "Campus Register", tagline: data.tagline || "School Workspace" }; }
  document.getElementById("login-school-name").textContent = SCHOOL.name;
  document.getElementById("side-school-name").textContent = SCHOOL.name;
}

/* ---------------- Auth: sign in / sign up toggle ---------------- */
let mode = "signin";
document.getElementById("switch-btn").addEventListener("click", async ()=>{
  mode = mode === "signin" ? "signup" : "signin";
  document.getElementById("signin-form").style.display = mode==="signin" ? "block":"none";
  document.getElementById("signup-form").style.display = mode==="signup" ? "block":"none";
  document.getElementById("switch-prompt").textContent = mode==="signin" ? "New school workspace? " : "Already have an account? ";
  document.getElementById("switch-btn").textContent = mode==="signin" ? "Create one" : "Sign in";
  document.getElementById("login-sub-text").textContent = mode==="signin" ? "Sign in to your school workspace" : "Create your school workspace account";
  document.getElementById("su-notice").style.display = "none";
  if(mode==="signup"){ await refreshSignupClasses(); await refreshAdminOption(); }
});

document.getElementById("su-role").addEventListener("change", e=>{
  document.getElementById("su-class-wrap").style.display = e.target.value==="student" ? "block":"none";
});

let ADMIN_EXISTS = true;
async function refreshAdminOption(){
  const { data, error } = await sb.rpc("admin_exists");
  ADMIN_EXISTS = error ? true : !!data;
  const roleSel = document.getElementById("su-role");
  const adminOpt = roleSel.querySelector('option[value="admin"]');
  if(ADMIN_EXISTS){
    if(adminOpt) adminOpt.remove();
    if(roleSel.value === "admin") roleSel.value = "teacher";
    document.getElementById("su-code-wrap").style.display = "block";
  } else if(!adminOpt){
    const opt = document.createElement("option");
    opt.value = "admin"; opt.textContent = "Admin (first account — sets up the school)";
    roleSel.insertBefore(opt, roleSel.firstChild);
    roleSel.value = "admin";
    document.getElementById("su-code-wrap").style.display = "none";
  }
}

async function refreshSignupClasses(){
  const { data } = await sb.from("classes").select("id,name").order("name");
  const sel = document.getElementById("su-class");
  sel.innerHTML = (data||[]).length ? data.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("") : `<option value="">No classes yet — ask admin</option>`;
}

const STUDENT_EMAIL_DOMAIN = "students.schoolapp.local";
function rollNoToEmail(roll){
  return "roll" + String(roll).trim().toLowerCase().replace(/[^a-z0-9]/g,"") + "@" + STUDENT_EMAIL_DOMAIN;
}

document.getElementById("signin-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const raw = document.getElementById("si-email").value.trim();
  const email = raw.includes("@") ? raw : rollNoToEmail(raw);
  const password = document.getElementById("si-password").value;
  const errBox = document.getElementById("si-error");
  errBox.style.display="none";
  document.getElementById("si-btn").disabled = true;
  document.getElementById("si-btn").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  document.getElementById("si-btn").disabled = false;
  document.getElementById("si-btn").textContent = "Sign in";
  if(error){ errBox.textContent = error.message; errBox.style.display="block"; }
});

document.getElementById("signup-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const fullName = document.getElementById("su-name").value.trim();
  const role = document.getElementById("su-role").value;
  const classId = document.getElementById("su-class").value;
  const email = document.getElementById("su-email").value.trim();
  const password = document.getElementById("su-password").value;
  const enteredCode = document.getElementById("su-code").value.trim();
  const errBox = document.getElementById("su-error");
  errBox.style.display="none";

  if(ADMIN_EXISTS){
    const { data: s } = await sb.from("school_settings").select("access_code").eq("id",1).maybeSingle();
    const realCode = (s?.access_code || "").trim();
    if(!realCode){
      errBox.textContent = "Sign-ups are closed right now — ask your school admin to set an access code first.";
      errBox.style.display="block";
      return;
    }
    if(enteredCode.toLowerCase() !== realCode.toLowerCase()){
      errBox.textContent = "That access code doesn't match. Ask your school admin for the correct code.";
      errBox.style.display="block";
      return;
    }
  }

  document.getElementById("su-btn").disabled = true;
  document.getElementById("su-btn").textContent = "Creating account…";

  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){
    errBox.textContent = error.message; errBox.style.display="block";
    document.getElementById("su-btn").disabled = false; document.getElementById("su-btn").textContent = "Create account";
    return;
  }

  let session = data.session;
  if(!session){
    // Email confirmation may be off but the client didn't get a session back yet — try signing in directly.
    const signInResult = await sb.auth.signInWithPassword({ email, password });
    session = signInResult.data?.session || null;
  }

  const userId = data.user?.id || session?.user?.id;
  if(userId && session){
    const { error: profErr } = await sb.from("profiles").insert({
      id:userId, full_name:fullName, role, class_id: role==="student" ? (classId||null) : null,
      approved: role === "teacher" ? false : true
    });
    if(profErr){
      errBox.textContent = profErr.message; errBox.style.display="block";
      document.getElementById("su-btn").disabled = false; document.getElementById("su-btn").textContent = "Create account";
      return;
    }
  }
  document.getElementById("su-btn").disabled = false;
  document.getElementById("su-btn").textContent = "Create account";

  if(!session){
    document.getElementById("su-notice").textContent = "Account created. Check your email to confirm, then sign in.";
    document.getElementById("su-notice").style.display = "block";
    document.getElementById("switch-btn").click();
  }
});

/* ---------------- Nav ---------------- */
const NAV_BY_ROLE = {
  admin:[["dashboard","Dashboard"],["classes","Classes"],["teachers","Teachers"],["students","Students"],["lessons","Lessons"],["quizzes","Quizzes"],["assignments","Assignments"],["attendance","Attendance"],["gradebook","Gradebook"],["announcements","Announcements"],["settings","Settings"]],
  teacher:[["dashboard","Dashboard"],["classes","Classes"],["lessons","Lessons"],["quizzes","Quizzes"],["assignments","Assignments"],["attendance","Attendance"],["gradebook","Gradebook"],["announcements","Announcements"]],
  student:[["dashboard","Dashboard"],["lessons","Lessons"],["quizzes","Quizzes"],["assignments","Assignments"],["gradebook","My grades"],["announcements","Announcements"]]
};
function buildNav(){
  const nav = document.getElementById("nav-items");
  nav.innerHTML = "";
  NAV_BY_ROLE[PROFILE.role].forEach(([key,label])=>{
    const b = document.createElement("button");
    b.className = "nav-item"+(key===ACTIVE_PAGE?" active":"");

    b.addEventListener("click", ()=>navigate(key));
    nav.appendChild(b);

function navigate(page){

  buildNav();
  const titles = {dashboard:"Dashboard", classes:"Classes", teachers:"Teachers", students:"Students", lessons:"Lessons", quizzes:"Quizzes", assignments:"Assignments", attendance:"Attendance", gradebook: PROFILE.role==="student"?"My grades":"Gradebook", announcements:"Announcements", settings:"Settings"};

function closeMobileSidebar(){

function wrapTablesForScroll(){

    if(t.parentElement.classList.contains("table-scroll")) return;
    const wrap = document.createElement("div");

/* ---------------- Dashboard ---------------- */
async function renderDashboard(){
  const { data: ann } = await sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(3);

  if(PROFILE.role==="student"){
    const { data: assignments } = await sb.from("assignments").select("*").eq("class_id", PROFILE.class_id);
    const { data: marks } = await sb.from("marks").select("*").eq("student_id", PROFILE.id);
    let sum=0,n=0;
    (assignments||[]).forEach(a=>{
      const m = (marks||[]).find(x=>x.assignment_id===a.id);
      if(m && m.marks!=null){ sum += (m.marks/a.max_marks)*100; n++; }
    });
    const avg = n? Math.round(sum/n) : null;
    return `
      <div class="grid-stats">
        <div class="stat"><div class="stat-label">Average score</div><div class="stat-value">${avg===null?"—":avg+"%"}</div></div>
        <div class="stat"><div class="stat-label">Assignments</div><div class="stat-value">${(assignments||[]).length}</div></div>
      </div>
      <div class="panel"><h3>Latest announcements</h3>${renderAnnList(ann)}</div>
    `;
  }

  let classQ = sb.from("classes").select("id");
  if(PROFILE.role==="teacher") classQ = classQ.eq("teacher_id", PROFILE.id);
  const { data: classes } = await classQ;
  const classIds = (classes||[]).map(c=>c.id);
  const safeIds = classIds.length ? classIds : ["00000000-0000-0000-0000-000000000000"];

  let studentCount;
  if(PROFILE.role==="admin"){
    const { count } = await sb.from("profiles").select("id",{count:"exact",head:true}).eq("role","student");
    studentCount = count;
  } else {
    const { count } = await sb.from("profiles").select("id",{count:"exact",head:true}).eq("role","student").in("class_id", safeIds);
    studentCount = count;
  }
  const { count: assignmentCount } = await sb.from("assignments").select("id",{count:"exact",head:true}).in("class_id", safeIds);
  const today = todayStr();
  const { data: attToday } = await sb.from("attendance").select("status").eq("date",today).in("class_id", safeIds);
  const total = (attToday||[]).length;
  const present = (attToday||[]).filter(a=>a.status==="present").length;
  const attPct = total? Math.round(present/total*100) : null;

  return `
    <div class="grid-stats">
      <div class="stat"><div class="stat-label">Classes</div><div class="stat-value">${(classes||[]).length}</div></div>
      <div class="stat"><div class="stat-label">Students</div><div class="stat-value">${studentCount||0}</div></div>
      <div class="stat"><div class="stat-label">Assignments</div><div class="stat-value">${assignmentCount||0}</div></div>
      <div class="stat"><div class="stat-label">Attendance today</div><div class="stat-value">${attPct===null?"—":attPct+"%"}</div><div class="stat-sub">${total? "marked for "+total+" students":"not marked yet"}</div></div>
    </div>
    <div class="panel"><h3>Latest announcements</h3>${renderAnnList(ann)}</div>
  `;
}
function renderAnnList(ann){
  if(!ann || !ann.length) return `<div class="empty">No announcements posted yet.</div>`;
  return ann.map(a=>`<div class="announce-item"><div class="announce-title">${esc(a.title)}</div><div class="announce-meta">${fmtDate(a.created_at)}</div><div class="announce-body">${esc(a.body)}</div></div>`).join("");
}

/* ---------------- Video Lessons: Class -> Subjects -> Lessons -> Video ---------------- */
function ytEmbedUrl(url){
  if(!url) return null;
  let id = null;
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  if(m) id = m[1];
  if(!id) return null;
  return "https://www.youtube.com/embed/" + id;
}

function lessonsState(){
  if(!window.__lessons) window.__lessons = { classId:null, subjectId:null, lessonId:null };
  return window.__lessons;
}

async function renderLessons(){
  const st = lessonsState();
  const staff = PROFILE.role !== "student";

  let classes;
  if(staff){ classes = await myClasses(); }
  else { const { data } = await sb.from("classes").select("id,name").eq("id", PROFILE.class_id); classes = data || []; }
  window.__classesCache = classes;

  if(!classes.length) return `<div class="empty"><span class="serif">No classes yet</span></div>`;
  if(!st.classId || !classes.some(c=>c.id===st.classId)) st.classId = classes[0].id;

  // ----- Video detail view -----
  if(st.lessonId){
    const { data: lesson } = await sb.from("lessons").select("*").eq("id", st.lessonId).maybeSingle();
    if(!lesson) { st.lessonId = null; return renderLessons(); }
    const embed = ytEmbedUrl(lesson.youtube_url);
    let watched = false;
    if(!staff){
      const { data: v } = await sb.from("lesson_views").select("id").eq("lesson_id", lesson.id).eq("student_id", PROFILE.id).maybeSingle();
      watched = !!v;
    }
    return `
      <button class="btn btn-sm" onclick="lessonsState().lessonId=null; render();" style="margin-bottom:16px;">← Back to lessons</button>
      <div class="panel lesson-card">
        <h3>${esc(lesson.title)}</h3>
        ${embed ? `<div class="video-wrap"><iframe src="${embed}" allowfullscreen></iframe></div>` : `<div class="empty">Couldn't read this YouTube link.</div>`}
        ${lesson.description ? `<p style="margin-top:14px; font-size:14px; line-height:1.7; color:var(--text);">${esc(lesson.description)}</p>` : ""}
        ${staff ? `
          <div style="margin-top:16px; display:flex; gap:8px;">
            <button class="btn btn-sm" onclick="viewLessonViews('${lesson.id}','${esc(lesson.title)}','${st.classId}')">Views</button>
            <button class="btn btn-sm btn-danger" onclick="deleteLesson('${lesson.id}')">Delete</button>
          </div>
        ` : `
          <div style="margin-top:16px;">${watched ? `<span class="pill" style="background:var(--green-bg); color:var(--green);">✓ Watched</span>` : `<button class="btn btn-sm btn-gold" onclick="markWatched('${lesson.id}')">Mark as watched</button>`}</div>
        `}
      </div>
    `;
  }

  const classSelectHtml = classes.length > 1 ? `
    <div class="form-row" style="margin-bottom:20px; max-width:280px;">
      <div><label class="field-label">Class</label>
        <select class="text-input" id="lessons-class-select">${classes.map(c=>`<option value="${c.id}" ${c.id===st.classId?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
      </div>
    </div>` : "";

  // ----- Lessons list within a subject -----
  if(st.subjectId){
    const { data: subject } = await sb.from("subjects").select("*").eq("id", st.subjectId).maybeSingle();
    if(!subject){ st.subjectId = null; return renderLessons(); }
    const { data: lessons } = await sb.from("lessons").select("*").eq("subject_id", st.subjectId).order("created_at");
    let watchedSet = new Set();
    if(!staff){
      const { data: views } = await sb.from("lesson_views").select("lesson_id").eq("student_id", PROFILE.id);
      watchedSet = new Set((views||[]).map(v=>v.lesson_id));
    }
    return `
      <button class="btn btn-sm" onclick="lessonsState().subjectId=null; render();" style="margin-bottom:16px;">← Back to subjects</button>
      <div class="section-head">
        <h2>${esc(subject.name)}</h2>
        ${staff ? `<button class="btn btn-gold" onclick="showLessonForm('${st.subjectId}')">+ Add lesson</button>` : `<span class="count">${(lessons||[]).length} lessons</span>`}
      </div>
      ${(lessons||[]).length ? `
      <table><tr><th>Lesson</th>${!staff ? '<th>Status</th>' : '<th></th>'}</tr>
      ${lessons.map(l=>`<tr>
        <td><a href="#" onclick="lessonsState().lessonId='${l.id}'; render(); return false;" style="color:var(--ink); font-weight:500; text-decoration:underline;">${esc(l.title)}</a></td>
        <td style="text-align:right;">${staff ? `<button class="btn btn-sm btn-danger" onclick="deleteLesson('${l.id}')">Delete</button>` : (watchedSet.has(l.id) ? `<span class="pill" style="background:var(--green-bg); color:var(--green);">Watched</span>` : `<span class="pill pill-amber">Not yet</span>`)}</td>
      </tr>`).join("")}
      </table>` : `<div class="empty"><span class="serif">No lessons in this subject yet</span></div>`}
    `;
  }

  // ----- Subjects list -----
  const { data: subjects } = await sb.from("subjects").select("*").eq("class_id", st.classId).order("name");
  const subjectIds = (subjects||[]).map(s=>s.id);
  const { data: counts } = subjectIds.length ? await sb.from("lessons").select("subject_id").in("subject_id", subjectIds) : { data: [] };
  const countMap = {}; (counts||[]).forEach(l=>countMap[l.subject_id]=(countMap[l.subject_id]||0)+1);

  return `
    <div class="section-head">
      <h2>Lessons</h2>
      ${staff ? `<button class="btn btn-gold" onclick="showSubjectForm()">+ New subject</button>` : ``}
    </div>
    ${classSelectHtml}
    ${(subjects||[]).length ? `
    <table><tr><th>Subject</th><th>Lessons</th><th></th></tr>
    ${subjects.map(s=>`<tr>
      <td><a href="#" onclick="lessonsState().subjectId='${s.id}'; render(); return false;" style="color:var(--ink); font-weight:500; text-decoration:underline;">${esc(s.name)}</a></td>
      <td>${countMap[s.id]||0}</td>
      <td style="text-align:right;">${staff ? `<button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}')">Delete</button>` : ""}</td>
    </tr>`).join("")}
    </table>` : `<div class="empty"><span class="serif">No subjects yet</span>${staff ? "Create a subject to start adding lessons." : ""}</div>`}
  `;
}

async function renderQuizzes(){
  if(PROFILE.role==="student"){
    const { data: quizzes } = await sb.from("quizzes").select("*").eq("class_id", PROFILE.class_id).order("created_at",{ascending:false});
    const { data: attempts } = await sb.from("quiz_attempts").select("*").eq("student_id", PROFILE.id);
    const attemptMap = {}; (attempts||[]).forEach(a=>attemptMap[a.quiz_id]=a);
    return `
      <div class="section-head"><h2>Quizzes</h2><span class="count">${(quizzes||[]).length} total</span></div>
      ${(quizzes||[]).length ? `
      <table><tr><th>Quiz</th><th>Status</th><th></th></tr>
      ${quizzes.map(q=>{
        const at = attemptMap[q.id];
        return `<tr><td>${esc(q.title)}</td>
          <td>${at ? `<span class="pill" style="background:var(--green-bg); color:var(--green);">${at.score} / ${at.total}</span>` : `<span class="pill pill-amber">Not attempted</span>`}</td>
          <td style="text-align:right;"><button class="btn btn-sm" onclick="openQuiz('${q.id}')">${at?"Review":"Take quiz"}</button></td>
        </tr>`;
      }).join("")}
      </table>` : `<div class="empty"><span class="serif">No quizzes yet</span></div>`}
    `;
  }
  const classes = await myClasses();
  window.__classesCache = classes;
  const classIds = classes.map(c=>c.id);
  const safeIds = classIds.length ? classIds : ["00000000-0000-0000-0000-000000000000"];
  const { data: quizzes } = await sb.from("quizzes").select("*, class:classes(name)").in("class_id", safeIds).order("created_at",{ascending:false});
  return `
    <div class="section-head">
      <h2>Quizzes</h2>
      ${classes.length ? `<button class="btn btn-gold" onclick="showQuizBuilder()">+ New quiz</button>` : ``}
    </div>
    ${(quizzes||[]).length ? `
    <table><tr><th>Quiz</th><th>Class</th><th></th></tr>
    ${quizzes.map(q=>`<tr><td>${esc(q.title)}</td><td>${esc(q.class?.name||"—")}</td>
      <td style="text-align:right;">
        <button class="btn btn-sm" onclick="viewQuizResults('${q.id}','${esc(q.title)}')">Results</button>
        <button class="btn btn-sm btn-danger" onclick="deleteQuiz('${q.id}')" style="margin-left:6px;">Delete</button>
      </td></tr>`).join("")}
    </table>` : `<div class="empty"><span class="serif">No quizzes yet</span></div>`}
  `;
}

let quizDraftQuestions = [];
function showQuizBuilder(){
  quizDraftQuestions = [{ question:"", a:"", b:"", c:"", d:"", correct:"a" }];
  const classes = window.__classesCache || [];
  openModal(`
    <h3>New quiz</h3>
    <label class="field-label">Quiz title</label>
    <input class="text-input" id="f-qtitle" placeholder="e.g. Chapter 3 Quiz">
    <label class="field-label">Class</label>
    <select class="text-input" id="f-qclass">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
    <div id="qbuilder-questions" style="margin-top:16px;"></div>
    <button class="btn" onclick="addQuizQuestionRow()">+ Add question</button>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveQuiz()">Save quiz</button></div>
  `);
  renderQuizBuilderRows();
}
function renderQuizBuilderRows(){
  const wrap = document.getElementById("qbuilder-questions");
  wrap.innerHTML = quizDraftQuestions.map((q,i)=>`
    <div class="qbuilder-row">
      <div style="display:flex; justify-content:space-between;"><strong style="font-size:13px;">Question ${i+1}</strong>
        ${quizDraftQuestions.length>1 ? `<button class="btn btn-sm btn-danger" onclick="removeQuizQuestionRow(${i})">Remove</button>` : ""}
      </div>
      <input class="text-input" style="margin-top:8px;" placeholder="Question text" value="${esc(q.question)}" oninput="quizDraftQuestions[${i}].question=this.value">
      <div class="form-row" style="margin-top:8px;">
        <div><input class="text-input" placeholder="Option A" value="${esc(q.a)}" oninput="quizDraftQuestions[${i}].a=this.value"></div>
        <div><input class="text-input" placeholder="Option B" value="${esc(q.b)}" oninput="quizDraftQuestions[${i}].b=this.value"></div>
      </div>
      <div class="form-row">
        <div><input class="text-input" placeholder="Option C" value="${esc(q.c)}" oninput="quizDraftQuestions[${i}].c=this.value"></div>
        <div><input class="text-input" placeholder="Option D" value="${esc(q.d)}" oninput="quizDraftQuestions[${i}].d=this.value"></div>
      </div>
      <label class="field-label">Correct answer</label>
      <select class="text-input" onchange="quizDraftQuestions[${i}].correct=this.value">
        ${["a","b","c","d"].map(o=>`<option value="${o}" ${q.correct===o?"selected":""}>Option ${o.toUpperCase()}</option>`).join("")}
      </select>
    </div>
  `).join("");
}
function addQuizQuestionRow(){
  quizDraftQuestions.push({ question:"", a:"", b:"", c:"", d:"", correct:"a" });
  renderQuizBuilderRows();
}
function removeQuizQuestionRow(i){
  quizDraftQuestions.splice(i,1);
  renderQuizBuilderRows();
}
async function saveQuiz(){
  const title = document.getElementById("f-qtitle").value.trim();
  const classId = document.getElementById("f-qclass").value;
  if(!title || !classId) return;
  const valid = quizDraftQuestions.filter(q=>q.question.trim() && q.a.trim() && q.b.trim() && q.c.trim() && q.d.trim());
  if(!valid.length){ alert("Add at least one complete question (with all 4 options)."); return; }

  const { data: quiz, error } = await sb.from("quizzes").insert({ title, class_id:classId }).select().single();
  if(error){ alert(error.message); return; }
  const rows = valid.map((q,i)=>({
    quiz_id: quiz.id, question:q.question.trim(),
    option_a:q.a.trim(), option_b:q.b.trim(), option_c:q.c.trim(), option_d:q.d.trim(),
    correct_option:q.correct, position:i
  }));
  const { error: qErr } = await sb.from("quiz_questions").insert(rows);
  if(qErr){ alert(qErr.message); return; }
  closeModal(); render();
}
async function deleteQuiz(id){
  if(!confirm("Delete this quiz and all its results?")) return;
  await sb.from("quizzes").delete().eq("id", id);
  render();
}

async function openQuiz(quizId){
  const { data: quiz } = await sb.from("quizzes").select("*").eq("id", quizId).maybeSingle();
  const { data: questions } = await sb.from("quiz_questions").select("*").eq("quiz_id", quizId).order("position");
  const { data: existing } = await sb.from("quiz_attempts").select("*").eq("quiz_id", quizId).eq("student_id", PROFILE.id).maybeSingle();

  if(existing){
    // Review mode — show questions with correct answers marked (their own picks aren't stored individually, so show correct answers + their score)
    openModal(`
      <h3>${esc(quiz.title)} — Result</h3>
      <p style="font-size:15px; margin-bottom:16px;">You scored <strong>${existing.score} / ${existing.total}</strong></p>
      ${(questions||[]).map((q,i)=>`
        <div class="quiz-take-q">
          <div style="font-size:14px; margin-bottom:8px;"><strong>${i+1}.</strong> ${esc(q.question)}</div>
          ${["a","b","c","d"].map(o=>`<div class="quiz-opt ${o===q.correct_option?'correct':''}">${o===q.correct_option?"✓ ":"○ "}${esc(q["option_"+o])}</div>`).join("")}
        </div>
      `).join("")}
      <div class="modal-actions"><button class="btn btn-gold" onclick="closeModal()">Close</button></div>
    `);
    return;
  }

  openModal(`
    <h3>${esc(quiz.title)}</h3>
    <div id="quiz-take-body" data-quiz="${quizId}" data-total="${(questions||[]).length}">
      ${(questions||[]).map((q,i)=>`
        <div class="quiz-take-q">
          <div style="font-size:14px; margin-bottom:8px;"><strong>${i+1}.</strong> ${esc(q.question)}</div>
          ${["a","b","c","d"].map(o=>`
            <label class="quiz-opt" style="cursor:pointer;">
              <input type="radio" name="q_${q.id}" value="${o}" data-correct="${q.correct_option}">
              ${esc(q["option_"+o])}
            </label>
          `).join("")}
        </div>
      `).join("")}
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="submitQuiz()">Submit quiz</button></div>
  `);
}
async function submitQuiz(){
  const body = document.getElementById("quiz-take-body");
  const quizId = body.dataset.quiz;
  const total = parseInt(body.dataset.total);
  const groups = {};
  body.querySelectorAll("input[type=radio]").forEach(inp=>{
    if(!groups[inp.name]) groups[inp.name] = [];
    groups[inp.name].push(inp);
  });
  let score = 0;
  Object.values(groups).forEach(inputs=>{
    const checked = inputs.find(i=>i.checked);
    if(checked && checked.value === checked.dataset.correct) score++;
  });
  const { error } = await sb.from("quiz_attempts").insert({ quiz_id:quizId, student_id:PROFILE.id, score, total });
  if(error){ alert(error.message); return; }
  closeModal();
  render();
  setTimeout(()=>alert(`Quiz submitted! You scored ${score} / ${total}.`), 100);
}

  `);

async function saveNewStudent(){
  const name = document.getElementById("f-stname").value.trim();
  const roll = document.getElementById("f-stroll").value.trim();
  const classId = document.getElementById("f-stclass").value;
  const errBox = document.getElementById("stadd-error");
  errBox.style.display = "none";
  if(!name || !roll || !classId){ errBox.textContent = "Fill in name, roll number, and class."; errBox.style.display="block"; return; }

  const { data: settings } = await sb.from("school_settings").select("default_student_password").eq("id",1).maybeSingle();
  const defaultPass = (settings?.default_student_password || "").trim();
  if(!defaultPass || defaultPass.length < 6){
    errBox.textContent = "Set a default student password in Settings first (at least 6 characters).";
    errBox.style.display = "block";
    return;
  }

  const btn = document.getElementById("stadd-btn");
  btn.disabled = true; btn.textContent = "Creating…";

  // Use a separate, isolated Supabase client so this signUp doesn't overwrite the admin's own session.
  const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, storageKey: "sb-temp-student-create" } });
  const email = rollNoToEmail(roll);
  const { data: signUpData, error: signUpErr } = await tempClient.auth.signUp({ email, password: defaultPass });

  if(signUpErr){
    btn.disabled = false; btn.textContent = "Create account";
    errBox.textContent = signUpErr.message.includes("already registered") ? "This roll number is already in use." : signUpErr.message;
    errBox.style.display = "block";
    return;
  }

  const newId = signUpData.user?.id;
  if(!newId){
    btn.disabled = false; btn.textContent = "Create account";
    errBox.textContent = "Could not create the account. Try again.";
    errBox.style.display = "block";
    return;
  }

  const { error: profErr } = await sb.from("profiles").insert({
    id: newId, full_name: name, role: "student", class_id: classId, roll_no: roll, approved: true
  });
  await tempClient.auth.signOut();

  btn.disabled = false; btn.textContent = "Create account";
  if(profErr){
    errBox.textContent = profErr.message;
    errBox.style.display = "block";
    return;
  }
  closeModal();
  render();
  setTimeout(()=>alert(`Account created.\n\nRoll No: ${roll}\nPassword: ${defaultPass}\n\nShare these with the student — they can change their password after logging in.`), 100);
}

    </div>
    <label class="field-label">Attach PDF (optional — worksheet, homework sheet, etc.)</label>
    <input type="file" class="text-input" id="f-apdf" accept="application/pdf">
    <div id="apdf-status" style="font-size:12px; color:var(--text-muted); margin-top:6px;"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" id="save-assignment-btn" onclick="saveAssignment()">Save assignment</button></div>
  `);

async function saveAssignment(){
  const title = document.getElementById("f-atitle").value.trim();
  const classId = document.getElementById("f-aclass").value;
  const due = document.getElementById("f-adue").value || todayStr();
  const maxMarks = parseInt(document.getElementById("f-amax").value) || 20;
  const fileInput = document.getElementById("f-apdf");
  const file = fileInput.files[0];
  if(!title || !classId) return;

  let pdf_url = null, pdf_name = null;
  if(file){
    if(file.type !== "application/pdf"){ alert("Please choose a PDF file."); return; }
    const statusEl = document.getElementById("apdf-status");
    const btn = document.getElementById("save-assignment-btn");
    statusEl.textContent = "Uploading PDF…"; btn.disabled = true;
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const { error: upErr } = await sb.storage.from("homework").upload(path, file);
    btn.disabled = false;
    if(upErr){ statusEl.textContent = ""; alert("Could not upload PDF: " + upErr.message); return; }
    const { data: pub } = sb.storage.from("homework").getPublicUrl(path);
    pdf_url = pub.publicUrl; pdf_name = file.name;
  }

  const { error } = await sb.from("assignments").insert({ title, class_id:classId, due, max_marks:maxMarks, pdf_url, pdf_name });
  if(error){ alert(error.message); return; }
  closeModal(); render();
}
async function deleteAssignment(id){
  if(!confirm("Delete this assignment?")) return;
  await sb.from("assignments").delete().eq("id", id);
  render();
}

  const { data: marks } = await sb.from("marks").select("*").eq("assignment_id", assignmentId);
  const markMap = {}; (marks||[]).forEach(m=>markMap[m.student_id]=m.marks);
  openModal(`
    <h3>Grade — ${esc(title)}</h3>
    <div style="max-height:340px; overflow-y:auto;" id="grade-rows" data-aid="${assignmentId}" data-max="${maxMarks}">
    ${(roster||[]).map(s=>`
      <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line);">
        <span style="font-size:14px;">${esc(s.full_name)}</span>
        <input type="number" class="text-input" style="width:80px; text-align:center;" min="0" max="${maxMarks}" data-sid="${s.id}" value="${markMap[s.id]!=null?markMap[s.id]:''}" placeholder="/ ${maxMarks}">
      </div>`).join("")}
    ${(roster||[]).length===0 ? `<div class="empty">No students in this class yet.</div>`:''}
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveGrades()">Save marks</button></div>
  `);
}
async function saveGrades(){
  const wrap = document.getElementById("grade-rows");
  const assignmentId = wrap.dataset.aid;
  const inputs = wrap.querySelectorAll("input[data-sid]");
  for(const inp of inputs){
    const sid = inp.dataset.sid;
    const val = inp.value === "" ? null : Math.max(0, parseInt(inp.value));
    await sb.from("marks").upsert({ assignment_id:assignmentId, student_id:sid, marks:val }, { onConflict:"assignment_id,student_id" });
  }
  closeModal(); render();
}

/* ---------------- Attendance ---------------- */
async function renderAttendance(){
  if(PROFILE.role==="student") return `<div class="empty"><span class="serif">Attendance is managed by your teacher</span></div>`;
  const classes = await myClasses();
  if(!classes.length) return `<div class="empty"><span class="serif">No classes yet</span></div>`;
  const activeClassId = window.__attClass || classes[0].id;
  window.__attClass = activeClassId;
  const activeDate = window.__attDate || todayStr();
  window.__attDate = activeDate;

  const { data: roster } = await sb.from("profiles").select("id,full_name").eq("role","student").eq("class_id",activeClassId).order("full_name");
  const { data: att } = await sb.from("attendance").select("*").eq("class_id",activeClassId).eq("date",activeDate);
  const rec = {}; (att||[]).forEach(a=>rec[a.student_id]=a.status);

  return `
    <div class="section-head"><h2>Attendance</h2></div>
    <div class="form-row" style="margin-bottom:22px;">
      <div><label class="field-label">Class</label>
        <select class="text-input" id="att-class">${classes.map(c=>`<option value="${c.id}" ${c.id===activeClassId?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
      </div>
      <div><label class="field-label">Date</label><input type="date" class="text-input" id="att-date" value="${activeDate}"></div>
    </div>
    ${(roster||[]).length ? `
    <table><tr><th>Student</th><th style="text-align:right;">Mark</th></tr>
    ${roster.map(s=>`<tr><td>${esc(s.full_name)}</td><td style="text-align:right;">
      <button class="toggle-btn ${rec[s.id]==='present'?'on-present':''}" onclick="markAttendance('${s.id}','present')">Present</button>
      <button class="toggle-btn ${rec[s.id]==='absent'?'on-absent':''}" onclick="markAttendance('${s.id}','absent')">Absent</button>
    </td></tr>`).join("")}
    </table>` : `<div class="empty">No students in this class yet.</div>`}
  `;
}
async function markAttendance(sid, status){
  await sb.from("attendance").upsert({ class_id:window.__attClass, date:window.__attDate, student_id:sid, status }, { onConflict:"class_id,date,student_id" });
  render();
}

/* ---------------- Gradebook ---------------- */
async function renderGradebook(){
  if(PROFILE.role==="student"){
    const { data: list } = await sb.from("assignments").select("*").eq("class_id", PROFILE.class_id).order("due");
    const { data: marks } = await sb.from("marks").select("*").eq("student_id", PROFILE.id);
    const markMap = {}; (marks||[]).forEach(m=>markMap[m.assignment_id]=m.marks);
    return `
      <div class="section-head"><h2>My grades</h2></div>
      ${(list||[]).length ? `<table><tr><th>Assignment</th><th>Max marks</th><th>Your score</th></tr>
      ${list.map(a=>`<tr><td>${esc(a.title)}</td><td>${a.max_marks}</td><td>${markMap[a.id]!=null?markMap[a.id]+" / "+a.max_marks:"—"}</td></tr>`).join("")}
      </table>` : `<div class="empty">No grades recorded yet.</div>`}
    `;
  }
  const classes = await myClasses();
  if(!classes.length) return `<div class="empty">No classes yet.</div>`;
  const activeClassId = window.__gbClass || classes[0].id;
  window.__gbClass = activeClassId;
  const { data: roster } = await sb.from("profiles").select("id,full_name").eq("role","student").eq("class_id",activeClassId).order("full_name");
  const { data: assignments } = await sb.from("assignments").select("*").eq("class_id",activeClassId).order("due");
  const aIds = (assignments||[]).map(a=>a.id);
  const { data: marks } = await sb.from("marks").select("*").in("assignment_id", aIds.length?aIds:["00000000-0000-0000-0000-000000000000"]);
  const markMap = {}; (marks||[]).forEach(m=>markMap[m.assignment_id+"__"+m.student_id]=m.marks);

  function avgFor(sid){
    let sum=0,n=0;
    (assignments||[]).forEach(a=>{
      const m = markMap[a.id+"__"+sid];
      if(m!=null){ sum += (m/a.max_marks)*100; n++; }
    });
    return n? Math.round(sum/n) : null;
  }

  return `
    <div class="section-head"><h2>Gradebook</h2></div>
    <div class="form-row" style="margin-bottom:20px;"><div style="max-width:280px;">
      <label class="field-label">Class</label>
      <select class="text-input" id="gb-class">${classes.map(c=>`<option value="${c.id}" ${c.id===activeClassId?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
    </div></div>
    ${(roster||[]).length && (assignments||[]).length ? `
    <table><tr><th>Student</th>${assignments.map(a=>`<th>${esc(a.title)}</th>`).join("")}<th>Average</th></tr>
    ${roster.map(s=>`<tr><td>${esc(s.full_name)}</td>${assignments.map(a=>{
      const m = markMap[a.id+"__"+s.id];
      return `<td>${m!=null?m+" / "+a.max_marks:"—"}</td>`;
    }).join("")}<td><strong>${avgFor(s.id)===null?"—":avgFor(s.id)+"%"}</strong></td></tr>`).join("")}
    </table>` : `<div class="empty">Add students and assignments to see the gradebook.</div>`}
  `;
}

/* ---------------- Announcements ---------------- */
async function renderAnnouncements(){
  const { data: list } = await sb.from("announcements").select("*").order("created_at",{ascending:false});
  const canPost = PROFILE.role !== "student";
  return `
    <div class="section-head"><h2>Announcements</h2>${canPost?`<button class="btn btn-gold" onclick="showAnnouncementForm()">+ Post announcement</button>`:``}</div>
    ${(list||[]).length ? list.map(a=>`
      <div class="announce-item">
        <div class="announce-title">${esc(a.title)}</div>
        <div class="announce-meta">${fmtDate(a.created_at)} ${canPost?`· <a href="#" onclick="deleteAnnouncement('${a.id}');return false;" style="color:var(--red);">remove</a>`:""}</div>
        <div class="announce-body">${esc(a.body)}</div>
      </div>`).join("") : `<div class="empty"><span class="serif">Nothing posted yet</span></div>`}
  `;
}
function showAnnouncementForm(){
  openModal(`
    <h3>Post announcement</h3>
    <label class="field-label">Title</label>
    <input class="text-input" id="f-ntitle" placeholder="e.g. School closed on Monday">
    <label class="field-label">Message</label>
    <textarea class="text-input" id="f-nbody" rows="4" placeholder="Write the details here"></textarea>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveAnnouncement()">Post</button></div>
  `);
}
async function saveAnnouncement(){
  const title = document.getElementById("f-ntitle").value.trim();
  const body = document.getElementById("f-nbody").value.trim();
  if(!title || !body) return;
  await sb.from("announcements").insert({ title, body });
  closeModal(); render();
}
async function deleteAnnouncement(id){
  await sb.from("announcements").delete().eq("id", id);
  render();
}

/* ---------------- Settings ---------------- */
async function renderSettings(){
  if(PROFILE.role !== "admin") return `<div class="empty">Only admins can change settings.</div>`;
  const { data: s } = await sb.from("school_settings").select("*").eq("id",1).maybeSingle();
  return `
    <div class="section-head"><h2>Settings</h2></div>
    <div class="panel">
      <h3>School branding</h3>
      <label class="field-label">School name</label>
      <input class="text-input" id="set-name" value="${esc(SCHOOL.name)}">
      <label class="field-label">Tagline</label>
      <input class="text-input" id="set-tag" value="${esc(SCHOOL.tagline)}">
      <button class="btn btn-gold" style="margin-top:18px;" onclick="saveBranding()">Save changes</button>
      <span id="set-saved" style="margin-left:12px; font-size:13px; color:var(--green); display:none;">Saved</span>
    </div>
    <div class="panel">
      <h3>School access code</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Teachers must enter this code when creating an account, so only staff from your school can sign up. Students don't self-signup — you create their accounts below. Share this code privately, not publicly.</p>
      <label class="field-label">Access code</label>
      <input class="text-input" id="set-code" value="${esc(s?.access_code||'')}" placeholder="e.g. SPRING2026">
      <button class="btn btn-gold" style="margin-top:18px;" onclick="saveAccessCode()">Save code</button>
      <span id="set-code-saved" style="margin-left:12px; font-size:13px; color:var(--green); display:none;">Saved</span>
    </div>
    <div class="panel">
      <h3>Default student password</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">When you create a student account (from the Students page), this password is set automatically. Share it with students and tell them to change it after their first login.</p>
      <label class="field-label">Default password</label>
      <input class="text-input" id="set-stud-pass" value="${esc(s?.default_student_password||'')}" placeholder="e.g. Spring@123">
      <button class="btn btn-gold" style="margin-top:18px;" onclick="saveDefaultStudentPassword()">Save password</button>
      <span id="set-pass-saved" style="margin-left:12px; font-size:13px; color:var(--green); display:none;">Saved</span>
    </div>
  `;
}
async function saveDefaultStudentPassword(){
  const pass = document.getElementById("set-stud-pass").value.trim();
  if(pass && pass.length < 6){ alert("Password should be at least 6 characters."); return; }
  await sb.from("school_settings").upsert({ id:1, default_student_password: pass });
  document.getElementById("set-pass-saved").style.display = "inline";
  setTimeout(()=>{ const el=document.getElementById("set-pass-saved"); if(el) el.style.display="none"; }, 2000);
}
async function saveAccessCode(){
  const code = document.getElementById("set-code").value.trim();
  await sb.from("school_settings").upsert({ id:1, access_code: code });
  document.getElementById("set-code-saved").style.display = "inline";
  setTimeout(()=>{ const el=document.getElementById("set-code-saved"); if(el) el.style.display="none"; }, 2000);
}
async function saveBranding(){
  const name = document.getElementById("set-name").value.trim() || "Campus Register";
  const tagline = document.getElementById("set-tag").value.trim() || "School Workspace";
  await sb.from("school_settings").upsert({ id:1, name, tagline });
  SCHOOL = { name, tagline };
  document.getElementById("side-school-name").textContent = name;
  document.getElementById("set-saved").style.display = "inline";
  setTimeout(()=>{ const el=document.getElementById("set-saved"); if(el) el.style.display="none"; }, 2000);
}

/* ---------------- Page-specific event wiring ---------------- */
function attachPageHandlers(){
  const lessonsClassSel = document.getElementById("lessons-class-select");
  if(lessonsClassSel) lessonsClassSel.addEventListener("change", e=>{ lessonsState().classId = e.target.value; lessonsState().subjectId=null; lessonsState().lessonId=null; render(); });
  const attClass = document.getElementById("att-class");
  if(attClass) attClass.addEventListener("change", e=>{ window.__attClass = e.target.value; render(); });
  const attDate = document.getElementById("att-date");
  if(attDate) attDate.addEventListener("change", e=>{ window.__attDate = e.target.value; render(); });
  const gbClass = document.getElementById("gb-class");
  if(gbClass) gbClass.addEventListener("change", e=>{ window.__gbClass = e.target.value; render(); });
}

/* ---------------- Boot ---------------- */
(async function init(){
  await loadSchoolSettings();
  await refreshSignupClasses();
  const { data } = await sb.auth.getSession();
  if(data.session){
    SESSION = data.session;
    const { data: prof } = await sb.from("profiles").select("*").eq("id", data.session.user.id).maybeSingle();
    PROFILE = prof;
    if(PROFILE && PROFILE.role==="teacher" && PROFILE.approved===false){
      showPendingScreen();
    } else if(PROFILE){
      enterApp();
    } else {
      showLogin();
    }
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
